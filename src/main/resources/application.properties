# build: 2026-07-04-v3
spring.application.name=Pair
server.port=8090
server.address=0.0.0.0

# Port HTTP additionnel (plain HTTP pour clients sans SSL)
server.http.port=8091

# SSL / HTTPS (port principal 8090)
server.ssl.enabled=true
server.ssl.key-store=classpath:pair-keystore.p12
server.ssl.key-store-password=pair2026
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=pair

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/pair_db
spring.datasource.username=${DB_USER:pair_user}
spring.datasource.password=${DB_PASSWORD:Pair2026!}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Corrélation client <-> serveur : chaque ligne de journal porte le X-Request-Id
# de la requête en cours (posé dans le MDC par RequestIdFilter), entre crochets
# après le niveau. Vide hors requête HTTP (jobs, démarrage).
logging.pattern.level=%5p [rid:%X{requestId:-}]

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.repair-on-migrate=true

# JPA Auditing
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP

# Chargement par paquets des associations paresseuses : quand N entites d'une
# meme page reclament chacune leur association, Hibernate emet une requete pour
# trente-deux d'entre elles au lieu d'une par entite. Filet general, pose sous
# les correctifs cibles et non a leur place : il divise un N+1 restant, il ne le
# supprime pas.
#
# Il couvre en particulier ce qu'un JOIN FETCH ne peut pas atteindre —
# Schedule.accessibilityTags est une @ElementCollection, et deux collections ne
# se ramenent pas par fetch join dans la meme requete.
spring.jpa.properties.hibernate.default_batch_fetch_size=32

# Le pool par defaut est de dix connexions. L'application mobile emet onze
# requetes en parallele a chaque reprise (refresh_on_resume.dart) : un seul
# utilisateur epuise donc le pool a lui seul. Le delai d'attente est ramene de
# trente secondes a dix : au-dela, le client mobile a de toute facon abandonne
# (api_client.dart, delai de trente secondes), et une connexion encore attendue
# ne sert plus qu'a retenir un thread.
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=10000

# spring.jpa.open-in-view n'est DELIBEREMENT pas pose ici, alors que sa valeur
# par defaut (true) retient la connexion pendant toute la serialisation de la
# reponse. Le passer a false ferait lever LazyInitializationException a chaque
# association lue hors transaction, et les mappers de ce projet en lisent
# beaucoup. Il se pose une fois les mappings du feed et des programmes rendus
# explicites, pas avant : c'est une bascule a verifier, pas une ligne de reglage.

# Poivre applicatif — clé HMAC des secrets courts du module de veille (code de
# retour, numéros de contacts ayant refusé d'être sollicités).
#
# AUCUNE VALEUR PAR DÉFAUT, délibérément, et à l'inverse de jwt.secret ci-dessous.
# Une clé de repli inscrite ici rendrait toute base fuitée entièrement énumérable
# — les deux espaces protégés sont petits, 17 millions de combinaisons pour le
# code et quelques centaines de millions pour un numéro de mobile — tout en
# donnant l'apparence d'une configuration correcte. Le démarrage échoue donc sous
# les profils prod, railway et staging si la variable est absente ; ailleurs, une
# clé éphémère est tirée à chaque démarrage, avec un avertissement.
#
# Format : « version:base64 », séparées par des virgules. Au moins 32 octets par
# clé. Tourner la clé = ajouter une entrée et avancer current-version ; les
# lignes déjà écrites gardent leur version et restent vérifiables.
#   SAFETY_PEPPER_KEYS=1:$(openssl rand -base64 32)
pair.pepper.keys=${SAFETY_PEPPER_KEYS:}
pair.pepper.current-version=${SAFETY_PEPPER_VERSION:1}

# Canal SMS du module de veille — ÉTEINT par défaut.
#
# La décision d'envoyer des SMS n'est pas tranchée. En attendant, les alertes de
# veille ne partent que par e-mail ; un contact externe accepté a toujours une
# adresse, l'invitation d'un contact qui n'a qu'un téléphone étant déjà refusée.
# L'infrastructure SMS (SmsService, outbox, gabarits ②③⑤) reste en place et
# prête : poser WATCH_SMS_ENABLED=true, et brancher un vrai fournisseur
# (twilio.enabled=true et ses secrets), suffira à l'allumer sans toucher au code.
pair.watch.sms.enabled=${WATCH_SMS_ENABLED:false}

# Fournisseur SMS réel (Twilio). Sans lui, le bean no-op journalise et n'envoie
# rien. Indépendant du drapeau ci-dessus : le canal peut être « voulu » sans
# qu'un fournisseur soit encore branché.
twilio.enabled=${TWILIO_ENABLED:false}

# Secret de signature du webhook Resend (accusés de remise des e-mails d'alerte).
# Format « whsec_<base64> », copié depuis la console Resend. SANS valeur de repli,
# comme les autres secrets : sous un profil de déploiement, un webhook non signé
# est rejeté en 401. À poser avec le webhook côté Resend, sinon les accusés de
# remise (delivered / bounced) ne sont pas pris en compte.
resend.webhook.secret=${RESEND_WEBHOOK_SECRET:}

# JWT Configuration
#
# AUCUNE VALEUR PAR DÉFAUT, pour la même raison que pair.pepper.keys ci-dessus,
# et la conséquence est ici plus grave. La clé signe les jetons d'accès ; le
# filtre valide la signature puis prend l'identifiant du jeton au pied de la
# lettre (JwtAuthFilter, JwtTokenProvider.extractUserId). Une clé de repli
# publiée avec ce dépôt — public — laisserait quiconque forger un jeton pour
# n'importe quel identifiant d'utilisateur, dont un modérateur, et être
# authentifié comme lui. Ce n'est pas une faiblesse de configuration, c'est un
# contournement d'authentification.
#
# Le démarrage échoue donc sous les profils prod, railway et staging si
# JWT_SECRET est absente. Hors de ces profils, une clé éphémère est tirée à
# chaque démarrage (voir JwtTokenProvider) ; le profil test, lui, pose sa propre
# clé fixe dans application-test.properties.
#   JWT_SECRET=$(openssl rand -base64 48)
jwt.secret=${JWT_SECRET:}
jwt.access-token-expiry-ms=900000
jwt.refresh-token-expiry-ms=2592000000

# Email (SMTP) — laisser spring.mail.host vide pour mode dev (les liens sont loggés)
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
email.from=${EMAIL_FROM:noreply@pair.app}
email.base-url=${APP_BASE_URL:http://localhost:3000}

# Origine publique du serveur — la racine des liens qu'on donne à lire au monde
# extérieur : page publique de créneau, route courte /s/{token}, lien de partage
# de sécurité, lien porté par un fichier .ics.
#
# À ne confondre avec aucune des deux autres URL du projet, qui désignent le
# front web et non ce serveur : email.base-url (ci-dessus) et app.frontend-url
# (profil railway). Les trois ont coexisté sans que rien ne les distingue ; c'est
# celle-ci, et elle seule, qui doit apparaître dans une balise og:url.
#
# Elle est absolue et en https : un robot d'aperçu ne suit pas de chemin relatif,
# et iOS refuse d'ouvrir l'application depuis un lien en http.
# lien.meetdo.fun, et non meetdo.fun. Les deux noms désignent deux serveurs :
# meetdo.fun est le site vitrine hébergé chez Hostinger, ce backend vit sur
# Railway. Le sous-domaine lui est dédié, et c'est lui qui doit apparaître dans
# une balise og:url comme dans un lien partagé.
#
# Ni proxy ni redirection depuis meetdo.fun : mod_proxy n'est pas disponible sur
# l'offre d'hébergement, et une redirection 302 aurait cassé l'aperçu — plusieurs
# robots de prévisualisation ne la suivent pas, or l'aperçu est toute la raison
# d'être de la page.
pair.public.base-url=${PUBLIC_BASE_URL:https://lien.meetdo.fun}

# Identité de l'application mobile, pour les fichiers d'association des liens
# universels (/.well-known). Valeurs relevées dans les projets iOS et Android et
# confirmées par l'équipe mobile le 2026-08-19 — elles ne sont pas devinables et
# ne doivent pas être inventées.
#
# Le Team ID et le bundle sont deux propriétés et non une : l'AASA veut leur
# concaténation, l'assetlinks Android veut le bundle seul. Les tenir séparément
# évite d'écrire deux fois la même valeur, donc de la voir diverger.
meetdo.links.apple-team-id=${APPLE_TEAM_ID:97727T64DH}
meetdo.links.bundle-id=${APP_BUNDLE_ID:com.meetdo.app}

# Empreinte SHA-256 du certificat de signature Android : DÉLIBÉRÉMENT VIDE.
#
# Elle dépend d'une décision qui n'est pas prise — signature locale ou Play App
# Signing, auquel cas c'est Google qui détient le certificat et l'empreinte n'est
# lisible que dans la console. Tant qu'elle manque, /.well-known/assetlinks.json
# répond 404, et c'est le bon comportement : Apple et Google mettent ces fichiers
# en cache agressivement, et une association fausse mémorisée par un appareil est
# plus longue à corriger qu'une association absente.
meetdo.links.android-sha256=${ANDROID_SHA256:}

# Schéma d'URI propre à l'application, pour rouvrir celle-ci depuis la page
# publique tant que les liens universels ne sont pas actifs. Les liens universels
# demandent, en plus des fichiers ci-dessus, l'entitlement associated-domains
# côté iOS et l'intent-filter App Links côté Android : deux moitiés qui échouent
# silencieusement l'une sans l'autre. Le schéma, lui, fonctionne déjà.
pair.mobile.scheme=${MOBILE_SCHEME:meetdo}

# Version en vigueur des règles de communauté.
#
# Portée par la configuration et non par une constante Java : redemander
# l'acceptation après une modification substantielle du texte ne doit pas
# imposer de redéployer un binaire. Surchargeable par variable d'environnement,
# comme JWT_SECRET ou APP_BASE_URL.
#
# Le texte lui-même reste embarqué dans l'application mobile. Le servir depuis
# ici demanderait un pipeline de contenu multilingue que le projet n'a pas — les
# fichiers messages*.properties conviennent aux libellés courts, pas à un texte
# de plusieurs paragraphes en trois langues. Le serveur ne porte que le
# versionnage, qui est le minimum sans lequel rien n'est redemandable.
pair.guidelines.current-version=${GUIDELINES_VERSION:1.0}

# Modèle d'embeddings local trilingue (FR/EN/DE) — remplace l'API OpenAI payante.
# Téléchargé au premier démarrage depuis meetdo.embedding.model-base-url si absent
# du chemin meetdo.embedding.model-path, puis réutilisé (voir application-railway.properties
# pour l'override du chemin vers le volume persistant en production).
meetdo.embedding.enabled=${MEETDO_EMBEDDING_ENABLED:true}
meetdo.embedding.model-path=${MODEL_PATH:${user.home}/.cache/meetdo-embeddings}

# Similarité cosine minimale (0-1) pour retenir un résultat de recherche vectorielle.
# Départ à 0.25 pour tolérer l'écart de similarité inhérent au matching cross-lingue ;
# à recalibrer avec des tests réels.
search.embedding.min-similarity=${SEARCH_EMBEDDING_MIN_SIMILARITY:0.25}

# Phase 2 Module 3: Storage Configuration
storage.location=${STORAGE_PATH:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Phase 4: Firebase Push Notifications (Optional)
firebase.enabled=${FIREBASE_ENABLED:false}
firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}
firebase.credentials-base64=${FIREBASE_CREDENTIALS_BASE64:}

# Phase 4: Redis (Optional)
redis.enabled=${REDIS_ENABLED:false}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Phase 4: Spring Actuator (Monitoring)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Data Seeding Configuration
pair.seed.reference-data.enabled=true
pair.seed.demo-data.enabled=false
