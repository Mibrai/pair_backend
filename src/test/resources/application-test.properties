server.ssl.enabled=false

# Port éphémère pour le connecteur HTTP additionnel de HttpConnectorConfig.
#
# webEnvironment = RANDOM_PORT ne randomise que server.port ; ce connecteur-là
# garde le 8091 d'application.properties dans chaque contexte de test. Deux
# exécutions d'intégration qui se chevauchent se disputent alors le même socket,
# et la seconde meurt sur « Connector configured to listen on port 8091 failed
# to start » — un échec qui ressemble à une régression du code et n'en est pas.
server.http.port=0

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration
jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci10ZXN0aW5nLW9ubHktbm90LXByb2Q=
jwt.access-token-expiry-ms=900000
jwt.refresh-token-expiry-ms=2592000000
spring.mail.host=localhost
spring.mail.port=3025
email.from=test@pair.app
email.base-url=http://localhost:3000
aws.s3.bucket=test-bucket
redis.enabled=true
redis.host=localhost
redis.port=6379

# Le modèle d'embeddings local ne doit pas se télécharger/charger dans les tests
# d'intégration : ReferenceDataSeeder tourne dans chaque contexte de test (voir
# pair.seed.reference-data.enabled=true par défaut) et chaque classe de test forke
# une JVM dédiée (voir maven-surefire-plugin dans pom.xml) — un vrai chargement de
# modèle serait payé à chaque classe. Désactivé ici, generateEmbedding() retombe sur
# un vecteur nul (voir LocalEmbeddingService.isZeroVector).
meetdo.embedding.enabled=false

# Le port 3025 ci-dessus est celui de GreenMail, et GreenMail n'est pas au pom :
# aucun serveur SMTP n'écoute pendant la suite. spring.mail.host étant posé,
# MailSenderAutoConfiguration crée quand même un JavaMailSender, donc
# MailHealthIndicator, qui rend DOWN — et avec lui l'agrégat /actuator/health,
# sans que rien ne soit cassé.
#
# Éteint ici pour que la santé de la suite dise la même chose que celle de la
# production, où application-railway.properties pose déjà la même ligne et
# exclut MailSenderAutoConfiguration : nulle part on n'attend de SMTP, nulle
# part la santé ne doit s'en plaindre. L'envoi réel passe par l'API Resend.
management.health.mail.enabled=false
