# Connexion base de donnees - variables Railway (postgres_db)
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

server.ssl.enabled=false
server.port=${PORT:8080}

# TLS est terminé par la plateforme, en amont : l'application ne reçoit que du
# HTTP en clair et croirait, sans cette ligne, que le client aussi. Toute URL
# absolue qu'elle compose elle-même sortirait alors en http:// — donc les og:url
# des pages de partage. Facebook et WhatsApp suivraient la redirection, mais les
# liens universels iOS non : le lien n'ouvrirait jamais l'application.
#
# Volontairement posé ici et pas dans application.properties : honorer les
# en-têtes X-Forwarded-* n'a de sens que derrière un proxy de confiance. Une
# instance jointe en direct les accepterait de n'importe qui.
server.forward-headers-strategy=framework

redis.enabled=${REDIS_ENABLED:false}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Disable Spring Boot mail auto-configuration (using Resend API instead)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
management.health.mail.enabled=false

# Resend configuration (email delivery via API)
resend.enabled=${RESEND_ENABLED:false}
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:infos@meetdo.fun}
resend.from-name=${RESEND_FROM_NAME:MeetDo}

# Frontend URL for email links
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

pair.seed.reference-data.enabled=true
pair.seed.demo-data.enabled=true

# Modèle d'embeddings local — volume persistant Railway (même principe que
# postgres_db-volume), pour éviter de re-télécharger le modèle à chaque redémarrage.
meetdo.embedding.model-path=${MODEL_PATH:/app/models/embedding}
meetdo.embedding.model-base-url=${MODEL_BASE_URL:https://github.com/Mibrai/pair_backend/releases/download/models-v1}