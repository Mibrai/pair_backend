# — Fachliche Ablehnungen: Medien (P-BS-01 Teil B, P-BA-10) —
# Keiner dieser drei Texte nennt die Datei, ihren Pfad oder den erkannten
# Dateityp.
error.MEDIA_FORBIDDEN=Diese Datei wurde von jemand anderem hochgeladen.
error.MEDIA_URL_INVALID=Diese Adresse verweist nicht auf eine von dir hochgeladene Datei.
error.MEDIA_TYPE_NOT_ALLOWED=Dieses Dateiformat wird nicht akzeptiert.

