# — cartes-souvenirs de créneau —
# Le client traduit sur le code, jamais sur ces messages : ils ne sont qu'un
# repli lisible quand personne ne les remplace.
error.RECAP_NEEDS_ATTENDEE=Attendez qu'au moins une autre personne confirme sa présence pour rendre cette carte publique.
error.RECAP_WINDOW_CLOSED=Cette carte est figée : la période de contribution de sept jours est terminée.
error.RECAP_NOT_ATTENDEE=Seules les personnes présentes à ce créneau peuvent contribuer à sa carte.
error.RECAP_NOT_HOST=Seul l'hôte du créneau peut modifier ce point.
error.RECAP_INVALID_VIBES=Choisissez au maximum deux ambiances, parmi celles proposées.

# Signalements et recommandations : refus « c'est déjà fait », rendus en 409.
error.REPORT_ALREADY_SUBMITTED=Vous avez déjà signalé cet élément.
error.RECOMMENDATION_ALREADY_GIVEN=Vous avez déjà recommandé cette personne.

# — template de notification, formule Android (T5) —
# Android n'a que le texte composé ici : à la différence d'iOS, aucune extension
# ne le réécrit sur l'appareil. Les motifs de date et d'heure vivent dans les
# fichiers de traduction et non dans le code, parce que ce sont des données de
# langue : l'ordre jour/mois vaut pour les trois langues servies, une quatrième
# obligerait à revoir le sien ici même, à l'endroit où on l'ajoute.
push.tpl.by=par {0}
push.tpl.countdown=dans {0}
push.tpl.today=Aujourd'hui
push.tpl.tomorrow=Demain
push.tpl.datePattern=EEE d MMM
push.tpl.timePattern=HH:mm
push.tpl.timeRange={0} – {1}

# Page publique de créneau. Le motif de date est porté par le catalogue et non
# par le code : l'ordre des éléments et le séparateur diffèrent d'une langue à
# l'autre, et une seule chaîne de format aurait donné « Samstag 14. Juni » en
# français ou l'inverse.
public.slot.datePattern=EEEE d MMMM
public.slot.timePattern=H'h'mm
