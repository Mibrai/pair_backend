<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Aucune métadonnée de partage social ici, délibérément : cette page dit
         où quelqu'un se rend, et ne doit pas produire d'aperçu quand le lien
         transite par une messagerie. C'est l'inverse exact de la page publique
         de créneau, dont l'aperçu est toute la raison d'être. -->
    <meta name="robots" content="noindex, nofollow">
    <title>Point de sécurité — meetDo</title>
    <th:block th:replace="~{fragments/marque :: styles}"></th:block>
</head>
<!--
  Habillée aux couleurs Aurora le 12/09/2026. Elle était grise, sans logo, sans
  nom : le destinataire — un proche, sans compte, qui reçoit « voici où je
  vais » — ouvrait une page qui pouvait être de n'importe qui. Sur ce lien-là
  plus que sur aucun autre, reconnaître la marque **est** le premier signal de
  confiance ; une page anonyme se referme, et le geste de sécurité tombe à
  plat.

  Le ruban est menthe, et non violet : le vert d'Aurora est la couleur des
  gestes de sécurité dans toute l'application (« Prévenir un proche »,
  « Envoyer où et quand »). La page continue la conversation commencée dans
  l'app.
-->
<body>
<div class="page">
    <header th:replace="~{fragments/marque :: entete}"></header>

    <main class="carte">
        <div class="ruban ruban-mint"></div>
        <div class="carte-corps">
            <p class="surtitre">Point de sécurité</p>
            <h1>Une personne vous a partagé son rendez-vous</h1>

            <dl class="faits">
                <dt>Activité</dt>
                <dd th:text="${activityName}">Yoga</dd>

                <dt>Quand</dt>
                <dd><span th:text="${day}">samedi 14 juin</span>,
                    de <span th:text="${startTime}">9h00</span>
                    à <span th:text="${endTime}">10h00</span></dd>

                <dt>Lieu</dt>
                <dd><span th:text="${placeName}">Studio Lumière</span><span
                        th:if="${city}" th:text="' — ' + ${city}"></span></dd>

                <dt>Organise</dt>
                <dd th:text="${organizerGivenName} ?: 'Non renseigné'">Camille</dd>
            </dl>

            <!-- Ce que la page **ne** montre pas est aussi important que ce
                 qu'elle montre, et se dit ici plutôt que dans une note en gris
                 clair : c'est la promesse du produit, pas une mention légale. -->
            <div class="encart encart-mint">
                <p>L'adresse exacte et les coordonnées des participants ne sont
                   volontairement pas affichées.</p>
            </div>

            <p class="note">Ce lien expire six heures après la fin prévue.</p>
        </div>
    </main>

    <footer th:replace="~{fragments/marque :: pied}"></footer>
</div>
</body>
</html>
