<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  ═══════════════════════════════════════════════════════════════════════════
  LA MARQUE meetDo SUR LE WEB — un seul endroit, pour huit pages.
  ═══════════════════════════════════════════════════════════════════════════

  POURQUOI CE FICHIER EXISTE
  --------------------------
  Les pages publiques étaient huit variations d'un même bloc gris : `#f5f6f7`
  en fond, une carte blanche, un `#14607f` bleu-canard en bouton, aucun logo,
  aucune mention de qui parle. Elles n'avaient rien à voir avec l'application
  qui les produit — le violet Aurora n'y apparaissait nulle part —, et le
  destinataire d'un lien de sécurité ouvrait une page qui pouvait être de
  n'importe qui. Sur un lien qui dit « voilà où je suis », c'est l'inverse de
  ce qu'on veut : la reconnaissance de la marque **est** le premier signal de
  confiance.

  CE QU'IL PORTE, ET CE QU'IL NE PORTE PAS
  ----------------------------------------
  Trois fragments — les styles, l'en-tête, le pied — et rien d'autre. Aucune
  page n'y met son contenu : le contenu reste chez elle, avec ses conditions
  et ses libellés. Un gabarit qui aurait avalé le contenu aurait obligé chaque
  page à décrire sa structure en paramètres, ce qui coûte plus cher que les
  trois lignes d'inclusion qu'il économise.

  LES JETONS SONT CEUX D'AURORA, RECOPIÉS UNE FOIS
  ------------------------------------------------
  Valeurs relevées dans `lib/shared/theme/app_colors.dart` et
  `app_context_colors.dart` du dépôt mobile, le 12/09/2026. C'est une copie —
  il n'y a pas de format commun entre un `Color(0xFF6C63FF)` Dart et une
  variable CSS — mais elle est **unique** : le jour où un jeton bouge, il bouge
  ici, pas dans huit gabarits.

  ⚠️ Le logo porte son propre dégradé de marque (#D8B4FE → #3B0764), distinct
  de l'accent Aurora #6C63FF. C'est une signature, pas un accent d'interface :
  on ne la recolore pas au thème. Même règle que `aurora_logo.dart`.

  CLAIR ET SOMBRE, LES DEUX
  -------------------------
  Obligatoire côté app, donc obligatoire ici : ces pages s'ouvrent le soir, sur
  un téléphone en thème sombre, souvent dans un navigateur intégré à une
  messagerie. Une page qui reste blanche à 23 h éblouit celui qu'on voulait
  rassurer.
-->
<head>

<!-- ══════════════════════════════════════════════════════════════════════ -->
<!-- Les styles. Inclus par un <th:block th:replace="~{fragments/marque ::  -->
<!-- styles}"> dans le <head> de chaque page.                               -->
<!-- ══════════════════════════════════════════════════════════════════════ -->
<style th:fragment="styles">
    :root {
        color-scheme: light dark;

        /* ── Accents Aurora ── */
        --violet: #6C63FF;
        --violet-dark: #4C3FE0;
        --violet-light: #9B95FF;
        --violet-tint: #F0EEFF;
        --mint: #22D3A7;
        --mint-dark: #0FA37F;
        --coral: #FF6B6B;
        --coral-dark: #E8484F;
        --amber-dark: #E08700;
        --sky: #38BDF8;

        /* ── Fonds ── */
        --canvas: #F3F2FB;
        --canvas-2: #EAE8F7;
        --surface: #FFFFFF;
        --surface-2: #FAF9FE;

        /* ── Encre ── */
        --text: #1A1A2E;
        --text-2: #626274;
        --text-3: #86869A;
        --border: #E5E5EE;

        /* Jamais une ombre noire neutre : les ombres Aurora sont teintées. */
        --ombre: 0 10px 26px rgba(108, 99, 255, .13);
        --ombre-douce: 0 2px 10px rgba(108, 99, 255, .08);

        --r-lg: 22px;
        --r-md: 16px;
        --r-sm: 11px;
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --canvas: #12121F;
            --canvas-2: #0C0C16;
            --surface: #1E1E31;
            --surface-2: #262640;
            --text: #F4F4FA;
            --text-2: #C6C6D6;
            --text-3: #9494AC;
            --border: #2E2E47;
            --violet-tint: #241F45;
            --ombre: none;
            --ombre-douce: none;
        }
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        padding: 0 1rem 2.5rem;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                     "Helvetica Neue", system-ui, sans-serif;
        line-height: 1.55;
        color: var(--text);
        /* Le halo violet du haut est la seule décoration de la page : il pose
           la marque avant même que le logo ne soit lu, et se dissout dans le
           fond au tiers de l'écran. */
        background:
            radial-gradient(120% 55% at 50% -8%, rgba(108, 99, 255, .18), transparent 70%),
            var(--canvas);
        background-repeat: no-repeat;
        min-height: 100vh;
        -webkit-text-size-adjust: 100%;
    }

    .page { max-width: 33rem; margin: 0 auto; }

    /* ── En-tête de marque ────────────────────────────────────────────── */
    .marque {
        display: flex;
        align-items: center;
        gap: .6rem;
        padding: 1.75rem 0 1.25rem;
    }
    .marque svg { display: block; width: 38px; height: 38px; }

    /* ── Le symbole, clair et sombre ───────────────────────────────────
       `aurora_logo.dart` livre deux fichiers — une variante fond clair, une
       variante fond sombre — parce que le tracé lavande du logo disparaît sur
       du blanc et que son étincelle rosée disparaît sur du noir. Ici, un seul
       tracé : ce sont les arrêts de dégradé qui changent, `stop-color` étant
       une propriété CSS comme une autre. Deux <svg> superposés auraient
       marché aussi, au prix d'un doublon que personne ne penserait à mettre à
       jour deux fois.

       Le défaut par défaut est la variante **fond clair**, comme la palette :
       ce qui n'est pas dans un bloc `prefers-color-scheme` est le mode clair. */
    .marque .arc-g-0 { stop-color: #A855F7; }
    .marque .arc-g-1 { stop-color: #7C3AED; }
    .marque .arc-d-0 { stop-color: #7C3AED; }
    .marque .arc-d-1 { stop-color: #3B0764; }
    .marque .etincelle { fill: #A855F7; }
    /* Ni halo ni anneau sur fond clair : ils y font une tache grise. */
    .marque .anneau { opacity: 0; }

    @media (prefers-color-scheme: dark) {
        .marque .arc-g-0 { stop-color: #D8B4FE; }
        .marque .arc-g-1 { stop-color: #7C3AED; }
        .marque .arc-d-0 { stop-color: #8B5CF6; }
        .marque .arc-d-1 { stop-color: #3B0764; }
        .marque .etincelle { fill: #FDF4FF; }
        .marque .anneau { opacity: .55; }
    }
    .marque-nom {
        font-size: 1.28rem;
        font-weight: 800;
        letter-spacing: -.02em;
        color: var(--text);
    }
    /* Le « Do » en violet : c'est le verbe, et c'est ce que le produit
       demande — on fait quelque chose, ensemble. */
    .marque-nom b { color: var(--violet); font-weight: 800; }

    /* ── La carte ─────────────────────────────────────────────────────── */
    .carte {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
        box-shadow: var(--ombre);
        overflow: hidden;
    }
    .carte-corps { padding: 1.6rem 1.4rem; }

    /* Le ruban dégradé en tête de carte — l'équivalent web de l'accent
       Aurora posé sur une carte d'écran. Quatre pixels : assez pour teinter,
       trop peu pour peser. */
    .ruban { height: 5px; background: linear-gradient(120deg, #6C63FF, #9B5DE5 55%, #FF6B6B); }
    .ruban-mint { background: linear-gradient(120deg, #22D3A7, #0FA37F); }
    .ruban-coral { background: linear-gradient(120deg, #FF6B6B, #E8484F); }
    .ruban-sky { background: linear-gradient(120deg, #38BDF8, #0B93D5); }

    .couverture { display: block; width: 100%; height: auto; }

    /* ── Typographie ──────────────────────────────────────────────────── */
    .surtitre {
        margin: 0 0 .35rem;
        font-size: .72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .09em;
        color: var(--violet);
    }
    h1 {
        margin: 0 0 1.1rem;
        font-size: 1.32rem;
        font-weight: 800;
        letter-spacing: -.01em;
        line-height: 1.3;
    }
    h2 {
        margin: 1.6rem 0 .6rem;
        font-size: .95rem;
        font-weight: 700;
    }
    p { margin: 0 0 .9rem; }
    p:last-child { margin-bottom: 0; }

    /* ── La grille de faits ───────────────────────────────────────────── */
    .faits {
        margin: 0;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: .7rem 1.1rem;
        align-items: baseline;
    }
    .faits dt {
        font-size: .68rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .08em;
        color: var(--text-3);
        white-space: nowrap;
    }
    .faits dd { margin: 0; font-weight: 600; }
    /* Sous 22rem — un iPhone SE en texte agrandi — deux colonnes ne tiennent
       plus : l'intitulé passe au-dessus de sa valeur plutôt que de couper un
       mot en deux. */
    @media (max-width: 22rem) {
        .faits { grid-template-columns: 1fr; gap: .25rem; }
        .faits dd { margin-bottom: .55rem; }
    }

    /* ── Boutons ──────────────────────────────────────────────────────── */
    .cta {
        display: block;
        width: 100%;
        text-align: center;
        text-decoration: none;
        border: 0;
        cursor: pointer;
        font-size: 1rem;
        font-weight: 700;
        font-family: inherit;
        padding: .95rem 1rem;
        border-radius: var(--r-md);
        color: #fff;
        background: linear-gradient(120deg, #6C63FF, #9B5DE5 55%, #FF6B6B);
        box-shadow: 0 10px 26px rgba(108, 99, 255, .36);
    }
    .cta-mint { background: linear-gradient(120deg, #22D3A7, #0FA37F);
                box-shadow: 0 10px 26px rgba(15, 163, 127, .34); }
    .cta-coral { background: linear-gradient(120deg, #FF6B6B, #E8484F);
                 box-shadow: 0 10px 26px rgba(232, 72, 79, .34); }
    .cta-secondaire {
        background: var(--surface-2);
        color: var(--violet-dark);
        border: 1px solid var(--border);
        box-shadow: none;
    }
    @media (prefers-color-scheme: dark) {
        .cta-secondaire { color: var(--violet-light); }
    }
    .cta + .cta { margin-top: .6rem; }
    .cta:focus-visible { outline: 3px solid var(--violet); outline-offset: 3px; }

    /* ── Notes et encarts ─────────────────────────────────────────────── */
    .note {
        margin: 1.2rem 0 0;
        font-size: .82rem;
        line-height: 1.5;
        color: var(--text-2);
    }
    .encart {
        margin: 1.1rem 0 0;
        padding: .85rem 1rem;
        border-radius: var(--r-sm);
        background: var(--violet-tint);
        border-left: 3px solid var(--violet);
        font-size: .85rem;
        color: var(--text-2);
    }
    .encart-mint { background: rgba(34, 211, 167, .12); border-left-color: var(--mint-dark); }
    .encart-coral { background: rgba(255, 107, 107, .12); border-left-color: var(--coral-dark); }
    .encart p:last-child { margin-bottom: 0; }

    .liens {
        margin: 1.1rem 0 0;
        text-align: center;
        font-size: .85rem;
        color: var(--text-2);
    }
    .liens a { color: var(--violet-dark); font-weight: 600; }
    @media (prefers-color-scheme: dark) { .liens a { color: var(--violet-light); } }

    /* ── Pied de page ─────────────────────────────────────────────────── */
    .pied {
        padding: 1.5rem .25rem 0;
        text-align: center;
        font-size: .76rem;
        line-height: 1.6;
        color: var(--text-3);
    }
    .pied a { color: var(--text-2); }
    .pied-signature { font-weight: 600; color: var(--text-2); }
</style>
</head>

<body>

<!-- ══════════════════════════════════════════════════════════════════════ -->
<!-- L'en-tête : le logo et le nom. À poser en tête de `.page`.            -->
<!--                                                                        -->
<!-- Le symbole est en SVG **inline** et non en <img> : une page qui dit    -->
<!-- où quelqu'un se trouve ne doit pas dépendre d'une seconde requête      -->
<!-- pour être reconnaissable, et un logo cassé sur une page de sécurité    -->
<!-- coûte plus que les huit cents octets qu'il économise.                  -->
<!-- ══════════════════════════════════════════════════════════════════════ -->
<header class="marque" th:fragment="entete">
    <svg viewBox="0 0 240 240" role="img" aria-label="meetDo" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="mdL" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop class="arc-g-0" offset="0%"/>
                <stop class="arc-g-1" offset="100%"/>
            </linearGradient>
            <linearGradient id="mdR" x1="100%" y1="0%" x2="0%" y2="100%">
                <stop class="arc-d-0" offset="0%"/>
                <stop class="arc-d-1" offset="100%"/>
            </linearGradient>
        </defs>
        <g transform="translate(120,120)">
            <path d="M -78 62 A 62 62 0 0 1 -16 0 A 62 62 0 0 0 -78 -62"
                  fill="none" stroke="url(#mdL)" stroke-width="26" stroke-linecap="round"/>
            <path d="M 78 62 A 62 62 0 0 0 16 0 A 62 62 0 0 1 78 -62"
                  fill="none" stroke="url(#mdR)" stroke-width="26" stroke-linecap="round"/>
            <circle class="etincelle" cx="0" cy="0" r="17"/>
            <circle class="anneau" cx="0" cy="0" r="30" fill="none" stroke="#C084FC" stroke-width="2.5"/>
        </g>
    </svg>
    <span class="marque-nom">meet<b>Do</b></span>
</header>

<!-- ══════════════════════════════════════════════════════════════════════ -->
<!-- Le pied : la baseline, le copyright, et rien de plus.                  -->
<!--                                                                        -->
<!-- L'année est calculée, jamais écrite : un « © 2026 » figé dans huit     -->
<!-- gabarits vieillit en silence, et une page datée de l'an dernier est le -->
<!-- signal exact qu'on veut éviter sur une page de confiance.              -->
<!-- ══════════════════════════════════════════════════════════════════════ -->
<footer class="pied" th:fragment="pied">
    <p class="pied-signature">meetDo — on publie un créneau, quelqu'un le rejoint.</p>
    <p>
        <span th:text="'© ' + ${#dates.year(#dates.createNow())} + ' meetDo'">© 2026 meetDo</span>
        <span aria-hidden="true"> · </span>
        <a href="https://meetdo.fun">meetdo.fun</a>
    </p>
</footer>

</body>
</html>
