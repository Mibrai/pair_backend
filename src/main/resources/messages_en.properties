# — global exception handler (P-BA-10 steps 3 and 5, P-BA-11 step 7) —
error.INTERNAL_ERROR=Something went wrong.
error.INVALID_PARAMETER=One of the request parameters is invalid.
# Named variant, for handleTypeMismatch: it says WHICH parameter, never the
# value received. Doubled apostrophes render as 'x'.
error.INVALID_PARAMETER.named=Parameter ''{0}'' is invalid.

# — push texts: slot change (P-BL-06) —
# Expected arguments:
#   .title      {0} programme title
#   .body.time  {0} new time, {1} previous time
#   .body.place {0} new place, {1} previous place
#   .body.both  {0} new time, {1} new place, {2} previous time, {3} previous place
# NO ADDRESS here, only the place name: these show on a locked screen (P-MS-10).
push.SCHEDULE_CHANGED.title=Session changed: {0}
push.SCHEDULE_CHANGED.body.time=New time: {0} (instead of {1})
push.SCHEDULE_CHANGED.body.place=New place: {0} (instead of {1})
push.SCHEDULE_CHANGED.body.both=New time and place: {0}, {1} (instead of {2}, {3})

