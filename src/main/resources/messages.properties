# — e-mails transactionnels —
# Le corps de l'e-mail de vérification était un littéral français en dur dans
# EmailService : ni Accept-Language, ni préférence de compte. Un germanophone,
# dont l'écran d'inscription s'appelle pourtant Registrieren, recevait du
# français — de quoi le classer en indésirable sans le lire, et ne jamais
# signaler qu'on l'avait reçu. Composé sur le fil de la requête (la langue
# n'existe plus au balayage de l'outbox).
#
# Ces trois blocs sont à remplacer par la rédaction du chantier mobile, qui
# porte la voix de meetDo et nous les fournit en fr/en/de. Ce qui suit tient la
# place et dit la même chose.
email.verification.subject=Vérifiez votre adresse — meetDo
email.verification.title=Vérifiez votre adresse
email.verification.intro=Un dernier geste pour activer votre compte meetDo : ouvrez le lien ci-dessous.
email.verification.button=Vérifier mon adresse
email.verification.expiry=Ce lien est valable 24 heures. Si vous n'avez pas créé de compte meetDo, ignorez ce message.

email.change.subject=Confirmez votre nouvelle adresse — meetDo
email.change.title=Confirmez votre nouvelle adresse
email.change.intro=Vous avez demandé que votre compte meetDo réponde désormais à {0}. Ouvrez le lien ci-dessous pour que ce changement prenne effet.
email.change.button=Confirmer cette adresse
email.change.expiry=Ce lien est valable 24 heures. Tant qu'il n'est pas ouvert, votre compte garde son adresse précédente. Si vous n'avez rien demandé, ignorez ce message.

# — quota —
# Servi sur les 429 des routes bornées. Le client en fait un avertissement et
# non une panne ; sans texte, « Une erreur est survenue. Réessaie. » s'affichait,
# ce qui est le pire conseil possible pour un quota horaire.
error.RATE_LIMITED=Trop de demandes depuis peu. Réessayez dans une heure.

# — refus métier : veilles retour —
# Servi quand on tente d'armer une veille sur une séance terminée. Un créneau
# ANNULÉ ne passe pas par ici : il rend un 404 « Créneau introuvable », comme le
# refus d'appartenance, pour ne pas confirmer ce qu'il a été.
error.WATCH_SLOT_ENDED=Cette séance est terminée : il n'y a plus de retour à surveiller.

# ═════════════════════════════════════════════════════════════════════════════
# Lot 1 — pré-passe de vocabulaire (2026-09-12)
#
# Ce bloc pose d'un coup les codes et les clés dont cinq fiches du lot 1 ont
# besoin (P-BS-01 B, P-BA-10, P-BL-14, P-BL-21, P-BL-06), plus les clés
# manquantes des codes déjà publiés (P-BA-11). Les fiches n'ont plus à toucher
# ni ErrorCode.java ni ces trois bundles.
#
# Rappel MessageFormat : la double apostrophe n'est requise que dans une clé qui
# porte un argument {n}. Les clés error.* n'en portent pas (le gestionnaire
# global appelle getOrNull sans argument), sauf error.INVALID_PARAMETER.named,
# signalée là où elle est.
# ═════════════════════════════════════════════════════════════════════════════

# — refus métier : référentiel d'activités (P-BA-10) —
# Les trois doublons d'ActivityService, qui partaient en CONFLICT générique avec
# leur message technique — nom de l'activité compris. Le nom disparaît : celui
# qui vient de le saisir l'a sous les yeux.
error.ACTIVITY_ALREADY_EXISTS=Cette activité existe déjà dans cette catégorie.
error.CATEGORY_ALREADY_EXISTS=Cette catégorie existe déjà.
error.USER_ACTIVITY_ALREADY_ADDED=Vous avez déjà ajouté cette activité.

# — refus métier : médias (P-BS-01 partie B, P-BA-10) —
# Aucun de ces trois textes ne nomme le fichier, son chemin, ni le type
# réellement détecté : ces trois-là ne partent qu'au journal (P-BS-19).
error.MEDIA_FORBIDDEN=Ce fichier a été déposé par quelqu'un d'autre.
error.MEDIA_URL_INVALID=Cette adresse ne désigne pas un fichier que vous avez déposé.
error.MEDIA_TYPE_NOT_ALLOWED=Ce format de fichier n'est pas accepté.

# — refus métier : créneaux annulés et files d'attente (P-BL-14, P-BL-21) —
# SLOT_NOT_FULL n'est pas une impasse mais un renvoi : le client rebascule sur
# « rejoindre », et la phrase doit le dire à qui la lit quand même.
error.SLOT_CANCELLED_READONLY=Ce créneau est annulé : il ne se modifie plus.
error.SLOT_NOT_FULL=Ce créneau n'est pas complet : rejoignez-le directement.
error.SLOT_CANCELLED_NO_ATTENDANCE=Cette séance est annulée : votre présence ne peut plus y être enregistrée.

# — gestionnaire global (P-BA-10 étapes 3 et 5, P-BA-11 étape 7) —
# Les deux codes existaient depuis toujours, sans clé : c'est ce qui faisait
# retomber l'app sur un message générique quelle que soit la langue demandée.
# Le texte de INTERNAL_ERROR reprend mot pour mot le littéral du gestionnaire,
# pour que le français ne change pas d'un caractère en passant par le bundle.
error.INTERNAL_ERROR=Une erreur est survenue.
error.INVALID_PARAMETER=Un paramètre de la requête est invalide.
# Variante nommée, pour handleTypeMismatch : elle dit QUEL paramètre, jamais la
# valeur reçue (P-BA-10 étape 5). Seule clé error.* à porter un argument, d'où
# les apostrophes doublées — elles rendent 'x' et non ''x''.
error.INVALID_PARAMETER.named=Paramètre ''{0}'' invalide.
error.PAGE_SIZE_TOO_LARGE=La taille de page demandée dépasse le maximum autorisé (50).
# Clés propres à un refus dont le code générique est lu par l'app publiée (P-BA-11) :
