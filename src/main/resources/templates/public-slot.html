<!DOCTYPE html>
<html th:lang="${lang}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${slot.programTitle} + ' — meetDo'">meetDo</title>

    <!-- Les métadonnées d'aperçu sont la raison d'être de cette page. Sans
         elles, un lien collé dans une messagerie reste une URL nue et ne
         convertit pas. th:content échappe les valeurs saisies par
         l'utilisateur : un titre contenant une apostrophe casserait sinon
         l'attribut, et avec lui tout l'aperçu. -->
    <meta property="og:type"        content="website">
    <meta property="og:site_name"   content="meetDo">
    <meta property="og:title"       th:content="${slot.programTitle}">
    <meta property="og:description" th:content="${ogDescription}">
    <meta property="og:url"         th:content="${ogUrl}">
    <!-- og:image n'est jamais nul : à défaut de photo, la vignette dessinée par
         PublicSlotCover. Un aperçu sans visuel s'affiche comme deux lignes
         grises, à peu près indiscernables d'un lien mort — et cet aperçu est la
         seule raison d'être de cette page. -->
    <meta property="og:image"       th:content="${ogImage}">
    <meta property="og:image:width"  content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale"      th:content="${lang}">
    <meta name="twitter:card"       content="summary_large_image">
    <meta name="twitter:title"      th:content="${slot.programTitle}">
    <meta name="twitter:description" th:content="${ogDescription}">
    <meta name="twitter:image"      th:content="${ogImage}">
    <!-- La couleur de la barre du navigateur, sur Android et dans les
         navigateurs intégrés : le violet de marque plutôt que le gris du
         système. C'est le premier pixel que voit celui qui ouvre le lien. -->
    <meta name="theme-color" content="#6C63FF">

    <!-- Le canonique désigne l'adresse courte, celle qu'on partage réellement :
         la même page est joignable par /public/slots/{token}/page, et deux URL
         pour un même contenu divisent les signaux d'un moteur de recherche. -->
    <link rel="canonical" th:href="${ogUrl}">

    <th:block th:replace="~{fragments/marque :: styles}"></th:block>
    <style>
        /* La note de bienvenue de l'organisateur : ses mots, mis en évidence
           sans être mis en scène. */
        .bienvenue {
            margin: 1.2rem 0 0;
            padding-left: .9rem;
            border-left: 3px solid var(--violet-light);
            color: var(--text-2);
            font-style: italic;
        }
        .indice {
            margin: .7rem 0 0;
            text-align: center;
            font-size: .8rem;
            color: var(--text-3);
        }
    </style>
</head>
<body>
<div class="page">
    <header th:replace="~{fragments/marque :: entete}"></header>

    <main class="carte">
        <img class="couverture" th:src="${ogImage}" alt="">
        <div class="carte-corps">
            <p class="surtitre">
                <span th:text="${slot.activityName}">Yoga</span><span
                    th:if="${slot.categoryName}" th:text="' · ' + ${slot.categoryName}"></span>
            </p>
            <h1 th:text="${slot.programTitle}">Yoga du samedi</h1>

            <dl class="faits">
                <dt th:text="${t.when}">Quand</dt>
                <dd><span th:text="${day}">samedi 14 juin</span>,
                    de <span th:text="${startTime}">9h00</span>
                    à <span th:text="${endTime}">10h00</span></dd>

                <dt th:text="${t.where}">Où</dt>
                <dd><span th:text="${slot.placeName}">Studio Lumière</span><span
                        th:if="${slot.city}" th:text="', ' + ${slot.city}"></span>
                    <!-- L'adresse n'apparaît que si elle est déjà diffusable : pour
                         un lieu privé non partagé, broadcastableAddress rend null. -->
                    <span th:if="${slot.displayAddress}" th:text="' — ' + ${slot.displayAddress}"></span></dd>

                <dt th:text="${t.who}">Participants</dt>
                <dd><span th:text="${t.joined}">3 inscrits</span><span
                        th:if="${slot.maxParticipants}" th:text="' / ' + ${slot.maxParticipants}"></span>
                    <span th:if="${t.host}" th:text="' — ' + ${t.host}"></span><span
                        th:if="${slot.organizerVerified}" title="Compte vérifié"> ✓</span></dd>
            </dl>

            <p class="bienvenue" th:if="${slot.welcomeNote}" th:text="${slot.welcomeNote}"></p>

            <div style="margin-top:1.5rem">
                <!-- Un seul bouton, aucun formulaire : la page a une seule chose à
                     obtenir, et tout ce qui la partage la dilue.

                     Il vise le schéma propre à l'application et non l'adresse de cette
                     page : celle-ci ne menait nulle part, l'application n'étant pas
                     ouverte par un lien vers le domaine où le navigateur se trouve déjà.

                     La ligne en dessous existe parce que ce schéma échoue en silence
                     quand l'application n'est pas installée — le navigateur ne fait
                     simplement rien, et sans un mot la page passerait pour cassée. -->
                <a class="cta" th:href="${appLink}" th:text="${t.cta}">Ouvrir dans meetDo</a>
                <p class="indice" th:text="${t.hint}"></p>
            </div>

            <!-- Deux liens discrets, et pas un bouton de plus : un créneau rejoint
                 puis oublié est une rencontre qui n'a pas lieu, et l'agenda est le
                 seul ajout de cette page qui agisse sur la présence réelle. -->
            <p class="liens">
                <a th:href="${calendarUrl}" th:text="${t.calendar}">Ajouter à mon agenda</a>
                <span aria-hidden="true"> · </span>
                <a href="https://meetdo.fun" th:text="${t.about}">Qu'est-ce que meetDo ?</a>
            </p>
        </div>
    </main>

    <footer th:replace="~{fragments/marque :: pied}"></footer>
</div>
</body>
</html>
