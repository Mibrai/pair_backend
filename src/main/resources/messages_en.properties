# — return watch (P-BL-11) —
# These five types were really emitted and all fell back to “New notification”.
# NO PLACE and no address in these texts: they show on a locked screen, stay in
# the notification centre and can be captured (P-MS-10). The alert to the
# contact does not name the watched person either — he knows who chose him.
