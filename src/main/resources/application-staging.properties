# Staging Environment Configuration

# Data Seeding Configuration
#
# demo-data.enabled=true est correct ici, et doit le rester : staging est fait
# pour ces comptes, et AdminSeedController y est expose (@Profile({"dev",
# "staging"})). C'est la raison pour laquelle le garde-fou du seed s'appuie sur
# Profils.PRODUCTION (prod, railway) et non sur Profils.DEPLOIEMENT, qui contient
# staging et sert, lui, a exiger la cle JWT (fiche d'audit P-BS-02).
pair.seed.reference-data.enabled=true
pair.seed.demo-data.enabled=true

# Le mot de passe des comptes de demonstration arrive par l'environnement, jamais
# par le depot : sans PAIR_SEED_DEMO_PASSWORD posee sur l'instance, le seed de
# demonstration refuse de creer les comptes. Aucun defaut n'est ecrit ici, et
# c'est le point de la fiche -- un defaut serait un mot de passe publie.
pair.seed.demo-password=${PAIR_SEED_DEMO_PASSWORD:}
