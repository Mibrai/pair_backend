<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Lien expiré — meetDo</title>
    <th:block th:replace="~{fragments/marque :: styles}"></th:block>
</head>
<body>
<div class="page">
    <header th:replace="~{fragments/marque :: entete}"></header>

    <main class="carte">
        <div class="ruban ruban-mint"></div>
        <div class="carte-corps">
            <!-- Un lien inconnu et un lien expiré affichent exactement la même
                 page : les distinguer confirmerait, à qui essaie des jetons,
                 qu'un rendez-vous a eu lieu. -->
            <h1>Ce lien n'est plus valable</h1>
            <p>Il a peut-être expiré. Les liens de sécurité cessent de
               fonctionner six heures après la fin du rendez-vous qu'ils
               décrivent.</p>
        </div>
    </main>

    <footer th:replace="~{fragments/marque :: pied}"></footer>
</div>
</body>
</html>
