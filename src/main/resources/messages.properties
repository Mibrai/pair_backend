# — bornage de la carte —
# Les bornes chiffrées reprennent les constantes de MapService : si elles
# changent là-bas, elles changent ici (et dans l'OpenAPI).
error.MAP_RADIUS_REQUIRES_USER_LOCATION=Le paramètre 'radiusMeters' exige 'userLat' et 'userLng'.
error.MAP_RADIUS_OUT_OF_RANGE=Le paramètre 'radiusMeters' doit être compris entre 1 et 200000.
error.MAP_BOUNDS_INCOMPLETE=Les bornes 'north', 'south', 'east' et 'west' vont ensemble : fournissez les quatre ou aucune.
error.MAP_BOUNDS_INVALID=Les bornes de la zone sont invalides.
error.MAP_LIMIT_OUT_OF_RANGE=Le paramètre 'limit' doit être supérieur ou égal à 1.
error.MAP_ZOOM_OUT_OF_RANGE=Le paramètre 'zoom' doit être compris entre 1 et 20.

