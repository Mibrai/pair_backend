# Connexion base de donnees - variables Railway (postgres_db)
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

server.ssl.enabled=false
server.port=${PORT:8080}

# TLS est terminé par la plateforme, en amont : l'application ne reçoit que du
# HTTP en clair et croirait, sans cette ligne, que le client aussi. Toute URL
# absolue qu'elle compose elle-même sortirait alors en http:// — donc les og:url
# des pages de partage. Facebook et WhatsApp suivraient la redirection, mais les
# liens universels iOS non : le lien n'ouvrirait jamais l'application.
#
# Volontairement posé ici et pas dans application.properties : honorer les
# en-têtes X-Forwarded-* n'a de sens que derrière un proxy de confiance. Une
# instance jointe en direct les accepterait de n'importe qui.
server.forward-headers-strategy=framework

redis.enabled=${REDIS_ENABLED:false}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Disable Spring Boot mail auto-configuration (using Resend API instead)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
management.health.mail.enabled=false

# Resend configuration (email delivery via API)
resend.enabled=${RESEND_ENABLED:false}
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:infos@meetdo.fun}
resend.from-name=${RESEND_FROM_NAME:MeetDo}

# Racine publique de l'API, utilisée pour bâtir les liens envoyés par e-mail.
#
# Cette propriété n'existait que dans application.properties, avec le défaut de
# développement http://localhost:3000, et APP_BASE_URL n'a jamais été posée en
# production : tous les e-mails de vérification sont partis avec un lien vers la
# machine du destinataire, qui affichait « impossible d'accéder à ce site ».
#
# Le défaut est ici la vraie valeur de production, et non plus une valeur de
# développement à surcharger. Un oubli de variable d'environnement redonne
# désormais le bon comportement au lieu du pire. APP_BASE_URL reste prioritaire
# si le domaine change.
#
# Ce n'est pas FRONTEND_URL, volontairement : le lien vise la route d'API, pas
# le site vitrine, qui rend 404 sur les chemins de vérification.
email.base-url=${APP_BASE_URL:https://lien.meetdo.fun}

pair.seed.reference-data.enabled=true

# Les données de démonstration n'ont rien à faire ici (fiche d'audit P-BS-02).
#
# Cette ligne valait true, et railway EST la production : le seeder y a créé
# vingt comptes demo<n>@pair.app dont le mot de passe était publié dans
# docs/seeds/. Le garde-fou de SeedRunner ne refusait alors que le profil
# nommé « prod », jamais « railway », et ne voyait donc rien à refuser.
#
# Deux verrous désormais, et il faut les deux : ce false, et le refus de
# démarrage de SeedRunner sous tout profil de Profils.PRODUCTION. Remettre
# cette ligne à true ne rallume pas le seed, cela empêche le démarrage — c'est
# voulu, et un test lit ce fichier pour qu'un retour à true ne passe pas en
# silence (config/ProfilRailwayTest).
#
# À ne pas confondre avec application-staging.properties, où true est correct :
# staging est un profil de déploiement pour la clé JWT, pas un profil de
# production pour le seed.
pair.seed.demo-data.enabled=false

# Modèle d'embeddings local — volume persistant Railway (même principe que
# postgres_db-volume), pour éviter de re-télécharger le modèle à chaque redémarrage.
meetdo.embedding.model-path=${MODEL_PATH:/app/models/embedding}
meetdo.embedding.model-base-url=${MODEL_BASE_URL:https://github.com/Mibrai/pair_backend/releases/download/models-v1}

# ---------------------------------------------------------------------------
# Observabilité (fiche d'audit P-BA-21, décision D9 option B)
# ---------------------------------------------------------------------------

# Port de gestion séparé, joignable seulement par le réseau privé Railway.
#
# Railway n'expose publiquement qu'un seul port, celui de PORT. Tout ce qui écoute
# ailleurs n'est atteignable que depuis un autre service du projet, par
# pair-backend.railway.internal — et c'est exactement le périmètre voulu pour les
# métriques : lisibles par l'agent de collecte, par personne d'autre.
#
# Sur le port public, seuls /actuator/health (et ses sondes readiness/liveness)
# et /actuator/info répondent encore : config/SantePubliqueController les
# republie quand le port de gestion est différent (décision §5.1 du 13/09). Le
# contrôle de santé de railway.json vise donc /actuator/health/readiness. Tout
# autre /actuator/* — prometheus compris — ne se lit que sur ce port privé.
#
# Retour arrière sans revert : poser MANAGEMENT_PORT à vide remet tout l'actuator
# sur le port public, où SecurityConfig ne laisse passer que santé et info.
management.server.port=${MANAGEMENT_PORT:9090}

# prometheus s'ajoute à la liste de application.properties, et seulement ici :
# le point de collecte n'existe que sur le port privé ci-dessus. Exige
# io.micrometer:micrometer-registry-prometheus au pom.
management.endpoints.web.exposure.include=health,info,prometheus

# Journaux structurés, natif Spring Boot, sans dépendance ajoutée. Le MDC
# requestId posé par shared/logging/RequestIdFilter est repris dans chaque objet
# JSON — c'est ce qui rend une requête suivable dans la console Railway, qui ne
# sait pas chercher dans un texte libre multi-lignes.
#
# Retour arrière : LOGGING_STRUCTURED_FORMAT_CONSOLE= (vide) ramène le format
# texte de application.properties, sans redéploiement de code.
logging.structured.format.console=${LOGGING_STRUCTURED_FORMAT_CONSOLE:ecs}

# ---------------------------------------------------------------------------
# Connexions à la base derrière le proxy Railway (fiche P-BA-05, étape 3)
# ---------------------------------------------------------------------------
#
# Ces trois lignes ne visent qu'un défaut : une connexion inactive coupée en
# silence par l'infrastructure, dont le pool ne s'aperçoit qu'au moment où une
# requête d'utilisateur s'en sert. Le coût est alors payé par cette requête-là —
# détection de la socket morte, puis établissement d'une connexion neuve, TLS
# compris, entre l'Europe et San Francisco.
#
# keepalive-time : Hikari sonde les connexions au repos toutes les 30 s, ce qui
#   les maintient en vie et, si l'une est morte, la remplace hors du chemin d'une
#   requête.
# max-lifetime : une connexion est retirée à 10 min, avant que l'infrastructure
#   ne décide de la couper. La valeur doit rester en dessous du délai
#   d'inactivité du proxy — DÉLAI NON CONFIRMÉ à ce jour, à relever auprès de
#   l'exploitation ; 10 min est un choix prudent, pas une mesure.
# minimum-idle : cinq connexions déjà chaudes, sur les 20 du pool. Sans ce
#   plancher, Hikari laisse le pool retomber à zéro entre deux pointes et la
#   première requête du matin paie l'ouverture.
#
# Ce n'est pas le correctif du plancher de latence : la cause tient d'abord à la
# distance entre le service et sa base (P-BA-05, étape 4). C'est ce qui empêche
# d'y ajouter une reconnexion.
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.minimum-idle=5

# P-BS-02 étape 5 : V116 ferme les comptes demo%@pair.app sur cette base.
spring.flyway.placeholders.fermer_comptes_demo=true
