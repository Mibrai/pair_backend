# — Push-Texte: Terminänderung (P-BL-06) —
# Erwartete Argumente:
#   .title      {0} Programmtitel
#   .body.time  {0} neue Uhrzeit, {1} bisherige Uhrzeit
#   .body.place {0} neuer Ort, {1} bisheriger Ort
#   .body.both  {0} neue Uhrzeit, {1} neuer Ort, {2} bisherige Uhrzeit, {3} bisheriger Ort
# KEINE ADRESSE hier, nur der Name des Ortes: diese Texte erscheinen auf einem
# gesperrten Bildschirm (P-MS-10). Sie-Form, wie die übrigen push.*-Schlüssel.
push.SCHEDULE_CHANGED.title=Termin geändert: {0}
push.SCHEDULE_CHANGED.body.time=Neue Uhrzeit: {0} (statt {1})
push.SCHEDULE_CHANGED.body.place=Neuer Ort: {0} (statt {1})
push.SCHEDULE_CHANGED.body.both=Neue Uhrzeit und neuer Ort: {0}, {1} (statt {2}, {3})

# ═════════════════════════════════════════════════════════════════════════════
# Bereits veröffentlichte Codes, die überhaupt keinen Schlüssel hatten (P-BA-11)
#
# Jeder von ihnen lieferte bisher das französische Literal seiner Ausnahme, in
# allen Sprachen. Die fünf GENERISCHEN Codes — VALIDATION_ERROR, NOT_FOUND,
# FORBIDDEN, CONFLICT, BUSINESS_RULE_VIOLATION — haben absichtlich auch hier
# keinen Schlüssel und dürfen keinen bekommen (P-BA-11 Schritt 4).
# ═════════════════════════════════════════════════════════════════════════════

