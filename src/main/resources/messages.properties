# Filet d'une contrainte de base violée (P-BL-12 étape 2). PAS error.CONFLICT :
# ce code générique sert de repli à une soixantaine de refus qui ont chacun leur
# message propre, et lui donner une clé les écraserait tous en silence — c'est
# ce qu'ErrorCodeTraductionTest interdit. handleDataIntegrityViolation lit donc
# cette clé-ci directement, et lui seul.
error.CONFLICT.generic=Cette action n'est pas possible dans l'état actuel.

# — textes push : modification de créneau (P-BL-06) —
# SCHEDULE_CHANGED est CRITICAL et EMAILED depuis toujours, mais n'avait aucun
# texte : l'émettre en l'état donnait « Nouvelle notification » en titre et,
# côté e-mail, « La séance « X » est annulée. » pour un simple changement
# d'heure. Trois corps distincts parce que la notification doit dire CE QUI a
# changé, avec l'ancienne valeur.
#
# Arguments attendus, dans cet ordre :
#   .title      {0} titre du programme (comme push.SLOT_CANCELLED.title)
#   .body.time  {0} nouvelle heure, {1} ancienne heure
#   .body.place {0} nouveau lieu, {1} ancien lieu
#   .body.both  {0} nouvelle heure, {1} nouveau lieu, {2} ancienne heure, {3} ancien lieu
#
# AUCUNE ADRESSE ici, rien que le nom du lieu (placeName) : ces textes
# s'affichent sur un écran verrouillé et s'y conservent (P-MS-10, P-BL-06
# étape 5). Formulation impersonnelle, comme push.SLOT_CANCELLED.body voisin :
# elle ne tranche pas le tutoiement/vouvoiement resté en suspens (P-MU-14).
push.SCHEDULE_CHANGED.title=Séance modifiée : {0}
push.SCHEDULE_CHANGED.body.time=Nouvel horaire : {0} (au lieu de {1})
push.SCHEDULE_CHANGED.body.place=Nouveau lieu : {0} (au lieu de {1})
push.SCHEDULE_CHANGED.body.both=Nouvel horaire et nouveau lieu : {0}, {1} (au lieu de {2}, {3})
push.SERIES_ENDED.title=La série s''arrête : {0}
push.SERIES_ENDED.body=La séance du {0} a bien lieu, les suivantes non.
push.SERIES_ENDED.bodyNoDate=La prochaine séance a bien lieu, les suivantes non.
push.SERIES_ENDED.datePattern=d MMMM

# ═════════════════════════════════════════════════════════════════════════════
# Codes déjà publiés qui n'avaient aucune clé (P-BA-11)
#
# Chacun rendait jusqu'ici le littéral français de l'exception, en toutes
# langues. Les textes ci-dessous reprennent ce littéral quand il était juste —
# c'est la source la plus fiable du sens — et lui retirent ce qu'il ne devait
# pas dire (valeur reçue, nom de fichier, type détecté).
#
# Les cinq codes GÉNÉRIQUES — VALIDATION_ERROR, NOT_FOUND, FORBIDDEN, CONFLICT,
# BUSINESS_RULE_VIOLATION — n'ont VOLONTAIREMENT pas de clé, et ne doivent pas
# en recevoir (P-BA-11 étape 4). GlobalExceptionHandler.messageOf cherche
# error.<CODE> sur le code RÉSOLU : une clé ici écraserait d'un texte vague le
# message propre des ~70 refus qui n'ont pas encore de code nommé.
# ErrorCodeTraductionTest tient les deux bouts de cette règle.
# ═════════════════════════════════════════════════════════════════════════════

# — authentification et forme de la requête —
# Ces sept-là sont composés à la main par leur gestionnaire (ou par le point
# d'entrée de SecurityConfig) et ne passent pas encore par messageOf : la clé
# est posée pour que le test soit vrai et que le passage à Messages n'ait plus
# qu'à l'appeler.
error.INVALID_CREDENTIALS=Identifiants invalides.
error.INVALID_TOKEN=Ce lien n'est plus valable : il a expiré ou a déjà servi.
error.UNAUTHORIZED=Authentification requise.
error.TOKEN_EXPIRED=Le jeton d'accès a expiré.
error.EMAIL_EXISTS=Cet email est déjà utilisé.
error.EMAIL_NOT_VERIFIED=Vérifiez votre adresse e-mail pour publier un créneau.
error.INVALID_JSON=Le corps de la requête n'est pas un JSON valide.
error.METHOD_NOT_ALLOWED=Cette méthode HTTP n'est pas acceptée sur cette adresse.

# — messagerie de programme —
error.PROGRAM_MESSAGES_DISABLED=L'auteur de ce programme n'accepte pas les messages de ses participants.
error.PROGRAM_BROADCAST_READ_ONLY=Seul l'auteur du programme peut écrire dans ce fil de diffusion.

# — abonnements —
# ALREADY_SUBSCRIBED est traité comme un succès par le client : ce texte n'est
# qu'un repli lisible. Il reste neutre parce que la cible peut être un auteur,
# une activité ou une catégorie.
error.ALREADY_SUBSCRIBED=Vous êtes déjà abonné.
error.SUBSCRIPTIONS_NOT_ALLOWED=Cette personne n'accepte pas de nouveaux abonnés.

# — bornage de la carte —
# Le chiffre reprend SlotBoundsRequest.PAST_WINDOW_DAYS, comme les bornes
# ci-dessus reprennent les constantes de MapService : s'il change là-bas, il
# change ici.
error.SLOT_PAST_WINDOW_TOO_WIDE=Les créneaux passés ne remontent pas à plus de 90 jours.

# — blocage d'utilisateur —
# Servi au seul bloqueur : le bloqué reçoit un 404 ordinaire, et la phrase ne
# doit donc jamais lui parvenir.
error.USER_BLOCKED=Vous avez bloqué cette personne.

# — règles de communauté —
error.GUIDELINES_VERSION_MISMATCH=Cette version des règles n'est plus celle en vigueur.

