# Development Environment Configuration

# Data Seeding Configuration
pair.seed.reference-data.enabled=true
pair.seed.demo-data.enabled=true

# Le mot de passe commun des comptes de demonstration (fiche d'audit P-BS-02).
#
# Il etait code en dur dans DemoDataSeeder et publie dans docs/seeds/. Il est
# desormais une propriete sans defaut : ce fichier-ci est le seul du depot a la
# poser, parce qu'il ne decrit qu'une base locale de developpement, ou ces
# comptes n'ouvrent l'acces a rien. Staging la recoit par la variable
# PAIR_SEED_DEMO_PASSWORD, et aucun profil de production ne peut plus allumer le
# seed de demonstration. Ne recopiez pas cette valeur ailleurs.
pair.seed.demo-password=DevSeedOnly1234!
