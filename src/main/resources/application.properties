# build: 2026-07-04-v3
spring.application.name=Pair
server.port=8090
server.address=0.0.0.0

# Port HTTP additionnel (plain HTTP pour clients sans SSL)
server.http.port=8091

# SSL / HTTPS (port principal 8090)
server.ssl.enabled=true
server.ssl.key-store=classpath:pair-keystore.p12
server.ssl.key-store-password=pair2026
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=pair

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/pair_db
spring.datasource.username=${DB_USER:pair_user}
spring.datasource.password=${DB_PASSWORD:Pair2026!}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.repair-on-migrate=true

# JPA Auditing
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP

# JWT Configuration
jwt.secret=${JWT_SECRET:YXByaWNvZGV2YXBwbGljYXRpb25wYWlyYXV0aGVudGljYXRpb25zZWNyZXRrZXk=}
jwt.access-token-expiry-ms=900000
jwt.refresh-token-expiry-ms=2592000000

# Email (SMTP) — laisser spring.mail.host vide pour mode dev (les liens sont loggés)
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
email.from=${EMAIL_FROM:noreply@pair.app}
email.base-url=${APP_BASE_URL:http://localhost:3000}

# Phase 2: LLM API Configuration (Anthropic Claude)
llm.api-url=https://api.anthropic.com/v1/messages
llm.api-key=${ANTHROPIC_API_KEY:}
llm.model=${LLM_MODEL:claude-sonnet-4-6}

# Phase 2: Embeddings API (OpenAI) - multilingual semantic search (EN/DE/FR)
embedding.api-url=https://api.openai.com/v1/embeddings
embedding.api-key=${OPENAI_API_KEY:}
embedding.model=text-embedding-3-small

# Similarité cosine minimale (0-1) pour retenir un résultat de recherche vectorielle.
# Départ à 0.25 pour tolérer l'écart de similarité inhérent au matching cross-lingue ;
# à recalibrer avec des tests réels.
search.embedding.min-similarity=${SEARCH_EMBEDDING_MIN_SIMILARITY:0.25}

# Phase 2 Module 3: Storage Configuration
storage.location=${STORAGE_PATH:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Phase 4: Firebase Push Notifications (Optional)
firebase.enabled=${FIREBASE_ENABLED:false}
firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}

# Phase 4: Redis (Optional)
redis.enabled=${REDIS_ENABLED:false}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Phase 4: Spring Actuator (Monitoring)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Data Seeding Configuration
pair.seed.reference-data.enabled=true
pair.seed.demo-data.enabled=false
