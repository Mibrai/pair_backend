# — Benachrichtigungsvorlage, Android-Formel (T5) —
# Android hat nur den hier zusammengesetzten Text: Anders als bei iOS schreibt
# ihn keine Erweiterung auf dem Gerät um. Datums- und Zeitmuster stehen in den
# Übersetzungsdateien und nicht im Code, denn sie sind Sprachdaten: Die
# Reihenfolge Tag/Monat gilt für die drei angebotenen Sprachen; eine vierte
# müsste ihre eigene genau hier festlegen, wo sie hinzugefügt wird.
push.tpl.by=von {0}
push.tpl.countdown=in {0}
push.tpl.today=Heute
push.tpl.tomorrow=Morgen
push.tpl.datePattern=EEE d. MMM
push.tpl.timePattern=HH:mm
push.tpl.timeRange={0} – {1}

