# ═════════════════════════════════════════════════════════════════════════════
# Lot 1 — Vokabular-Vorlauf (2026-09-12). Begründung siehe
# messages.properties; die Schlüsselliste ist in allen drei Bundles gleich,
# und ein Test hält das fest.
#
# Anredeform: die error.*-Schlüssel dieses Bundles duzen seit dem ersten Tag,
# die push.*-Schlüssel siezen. Dieser Block setzt beides fort, wie es
# vorgefunden wurde — die Vereinheitlichung ist eine Produktentscheidung
# (P-MU-14) und wird nicht hier nebenbei getroffen.
#
# MessageFormat: Apostrophe werden nur in Schlüsseln mit einem {n}-Argument
# verdoppelt. Kein error.*-Schlüssel trägt eines, außer
# error.INVALID_PARAMETER.named.
# ═════════════════════════════════════════════════════════════════════════════

