<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Lien expiré — meetDo</title>
    <style>
        :root { color-scheme: light dark; }
        body {
            margin: 0; padding: 2rem 1.25rem;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            line-height: 1.55; color: #16191c; background: #f5f6f7;
        }
        .card {
            max-width: 32rem; margin: 0 auto; background: #fff;
            border-radius: 10px; padding: 1.75rem; box-shadow: 0 1px 3px rgba(0,0,0,.09);
        }
        h1 { font-size: 1.15rem; margin: 0 0 .75rem; font-weight: 600; }
        p { margin: 0; color: #6b757d; }
        @media (prefers-color-scheme: dark) {
            body { background: #101315; color: #e6e9ea; }
            .card { background: #181c1f; box-shadow: none; }
            p { color: #8d979e; }
        }
    </style>
</head>
<body>
<div class="card">
    <!-- Un lien inconnu et un lien expiré affichent exactement la même page :
         les distinguer confirmerait, à qui essaie des jetons, qu'un rendez-vous
         a eu lieu. -->
    <h1>Ce lien n'est plus valable</h1>
    <p>Il a peut-être expiré. Les liens de sécurité cessent de fonctionner six
        heures après la fin du rendez-vous qu'ils décrivent.</p>
</div>
</body>
</html>
