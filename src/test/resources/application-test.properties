# Le modèle d'embeddings local ne doit pas se télécharger/charger dans les tests
# d'intégration : ReferenceDataSeeder tourne dans chaque contexte de test (voir
# pair.seed.reference-data.enabled=true par défaut) et chaque classe de test forke
# une JVM dédiée (voir maven-surefire-plugin dans pom.xml) — un vrai chargement de
# modèle serait payé à chaque classe. Désactivé ici, generateEmbedding() retombe sur
# un vecteur nul (voir LocalEmbeddingService.isZeroVector).
meetdo.embedding.enabled=false
