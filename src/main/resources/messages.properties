# Textes destinés à l'utilisateur final — français (langue par défaut).
#
# Ce fichier est le repli de toutes les autres langues : une clé absente de
# messages_en/de retombe ici, jamais sur la langue de la JVM
# (LocaleConfig.messageSource, fallbackToSystemLocale = false).
#
# Ne jamais mettre ici de valeur d'énumération ni de code d'erreur : le client
# les parse, ils restent en anglais SCREAMING_SNAKE_CASE.

