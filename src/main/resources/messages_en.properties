# — notification template, Android formula (T5) —
# Android only has the text composed here: unlike iOS, no extension rewrites it
# on the device. Date and time patterns live in the translation files rather
# than in code, because they are language data: the day/month order holds for
# the three languages served, and a fourth would have to settle its own right
# here, where it is added.
push.tpl.by=by {0}
push.tpl.countdown=in {0}
push.tpl.today=Today
push.tpl.tomorrow=Tomorrow
push.tpl.datePattern=EEE d MMM
push.tpl.timePattern=HH:mm
push.tpl.timeRange={0} – {1}

