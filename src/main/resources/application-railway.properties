# Connexion base de données ? variables Railway (postgres_db)
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

# Désactiver le SSL interne ? Railway gère le HTTPS en périphérie
server.ssl.enabled=false

# Écouter sur le port injecté par Railway (pas 8090 en dur)
server.port=${PORT:8080}

# Redis (si le service Redis est ajouté sur Railway)
redis.enabled=${REDIS_ENABLED:false}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Seeds ? phase de test
pair.seed.reference-data.enabled=true
pair.seed.demo-data.enabled=true